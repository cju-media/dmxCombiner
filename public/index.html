<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMX Stream Merger</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121214; color: #e4e4e7; margin: 0; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 1.75rem; margin-bottom: 2rem; color: #f4f4f5; display: flex; align-items: center; gap: 0.5rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        .card { background: #18181b; border: 1px solid #27272a; padding: 1.5rem; border-radius: 8px; }
        .card-title { font-weight: 600; margin-bottom: 1rem; font-size: 1.1rem; color: #a1a1aa; border-bottom: 1px solid #27272a; padding-bottom: 0.5rem; }
        .full-width { grid-column: span 2; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.85rem; color: #a1a1aa; margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.05em; }
        select, input { width: 100%; background: #27272a; border: 1px solid #3f3f46; border-radius: 4px; padding: 0.5rem; color: #f4f4f5; box-sizing: border-box; font-size: 0.95rem; }
        select:focus, input:focus { outline: 1px solid #3b82f6; border-color: #3b82f6; }
        button { background: #2563eb; color: white; border: none; border-radius: 4px; padding: 0.75rem 1.5rem; font-weight: 600; cursor: pointer; transition: background 0.2s; width: 100%; font-size: 1rem; }
        button:hover { background: #1d4ed8; }
        .status { font-size: 0.85rem; color: #10b981; display: inline-flex; align-items: center; gap: 0.35rem; margin-left: auto; }
        .header-wrap { display: flex; align-items: center; }
        .button-group { display: flex; gap: 1rem; margin-top: 1.5rem; }
        .button-secondary { background: #3f3f46; color: white; border: 1px solid #52525b; border-radius: 4px; padding: 0.75rem 1.5rem; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 1rem; flex: 1; }
        .button-secondary:hover { background: #52525b; }
        #btnSubmit { flex: 2; }
        #errorBox { background: #ef4444; color: white; padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem; display: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-wrap">
            <h1>🎛️ DMX Matrix Matrix / Merger</h1>
            <div class="status">● System Live</div>
        </div>

        <div id="errorBox"></div>

        <form id="configForm">
            <div class="grid">
                <div class="card">
                    <div class="card-title">Input Stream A</div>
                    <div class="form-group">
                        <label>Protocol</label>
                        <select id="inputA_protocol">
                            <option value="sacn">sACN (E1.31)</option>
                            <option value="artnet">Art-Net</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Universe</label>
                        <input type="number" id="inputA_universe" min="0" max="32767">
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">Input Stream B</div>
                    <div class="form-group">
                        <label>Protocol</label>
                        <select id="inputB_protocol">
                            <option value="sacn">sACN (E1.31)</option>
                            <option value="artnet">Art-Net</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Universe</label>
                        <input type="number" id="inputB_universe" min="0" max="32767">
                    </div>
                </div>

                <div class="card full-width">
                    <div class="card-title">Output Destinations (Simultaneous)</div>
                    <div class="grid" style="margin-bottom: 0; padding: 0;">
                        <div>
                            <label style="color: #3b82f6;">sACN Settings</label>
                            <div class="form-group" style="margin-top:0.5rem;">
                                <label>Universe</label>
                                <input type="number" id="output_sacn_universe" min="1">
                            </div>
                        </div>
                        <div>
                            <label style="color: #ec4899;">Art-Net Settings</label>
                            <div class="form-group" style="margin-top:0.5rem;">
                                <label>Target Destination</label>
                                <select id="output_artnet_target_type">
                                    <option value="specific">Specific IP Address</option>
                                    <option value="all">All Networks (Broadcast)</option>
                                </select>
                            </div>
                            <div class="form-group" id="output_artnet_ip_group">
                                <label>IP Target Address</label>
                                <input type="text" id="output_artnet_ip">
                            </div>
                            <div class="grid" style="grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin: 0;">
                                <div class="form-group">
                                    <label>Net</label>
                                    <input type="number" id="output_artnet_net" min="0" max="127">
                                </div>
                                <div class="form-group">
                                    <label>Subnet</label>
                                    <input type="number" id="output_artnet_subnet" min="0" max="15">
                                </div>
                                <div class="form-group">
                                    <label>Univ</label>
                                    <input type="number" id="output_artnet_universe" min="0" max="15">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="button-group">
                <button type="button" class="button-secondary" id="btnSaveFile">Save Config to File</button>
                <button type="button" class="button-secondary" id="btnLoadFile">Load Config from Disk</button>
                <input type="file" id="fileLoadConfig" accept=".json" style="display: none;">
                <button type="submit" id="btnSubmit">Apply Dynamic Routing Configuration</button>
            </div>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const form = document.getElementById('configForm');

        // Map UI Elements
        const fields = {
            'inputA.protocol': document.getElementById('inputA_protocol'),
            'inputA.universe': document.getElementById('inputA_universe'),
            'inputB.protocol': document.getElementById('inputB_protocol'),
            'inputB.universe': document.getElementById('inputB_universe'),
            'output.sacn.universe': document.getElementById('output_sacn_universe'),
            'output.artnet.target_type': document.getElementById('output_artnet_target_type'),
            'output.artnet.ip': document.getElementById('output_artnet_ip'),
            'output.artnet.net': document.getElementById('output_artnet_net'),
            'output.artnet.subnet': document.getElementById('output_artnet_subnet'),
            'output.artnet.universe': document.getElementById('output_artnet_universe'),
        };

        const artnetIpGroup = document.getElementById('output_artnet_ip_group');
        fields['output.artnet.target_type'].addEventListener('change', (e) => {
            if (e.target.value === 'all') {
                artnetIpGroup.style.display = 'none';
            } else {
                artnetIpGroup.style.display = 'block';
            }
        });

        // Populate fields with active state when page loads
        socket.on('currentConfig', (config) => {
            document.getElementById('errorBox').style.display = 'none';
            fields['inputA.protocol'].value = config.inputA.protocol;
            fields['inputA.universe'].value = config.inputA.universe;
            fields['inputB.protocol'].value = config.inputB.protocol;
            fields['inputB.universe'].value = config.inputB.universe;
            fields['output.sacn.universe'].value = config.output.sacn.universe;

            const targetType = config.output.artnet.target_type || 'specific';
            fields['output.artnet.target_type'].value = targetType;
            if (targetType === 'all') {
                artnetIpGroup.style.display = 'none';
            } else {
                artnetIpGroup.style.display = 'block';
            }

            fields['output.artnet.ip'].value = config.output.artnet.ip;
            fields['output.artnet.net'].value = config.output.artnet.net;
            fields['output.artnet.subnet'].value = config.output.artnet.subnet;
            fields['output.artnet.universe'].value = config.output.artnet.universe;
        });

        socket.on('configError', (errorMsg) => {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = errorMsg;
            errorBox.style.display = 'block';
        });

        function getConfigFromForm() {
            return {
                inputA: {
                    protocol: fields['inputA.protocol'].value,
                    universe: parseInt(fields['inputA.universe'].value)
                },
                inputB: {
                    protocol: fields['inputB.protocol'].value,
                    universe: parseInt(fields['inputB.universe'].value)
                },
                output: {
                    sacn: {
                        universe: parseInt(fields['output.sacn.universe'].value)
                    },
                    artnet: {
                        target_type: fields['output.artnet.target_type'].value,
                        ip: fields['output.artnet.ip'].value,
                        net: parseInt(fields['output.artnet.net'].value),
                        subnet: parseInt(fields['output.artnet.subnet'].value),
                        universe: parseInt(fields['output.artnet.universe'].value)
                    }
                }
            };
        }

        // Pack and ship changes upstream
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('errorBox');
            errorBox.style.display = 'none';

            const updatedConfig = getConfigFromForm();

            // Client-side validation to avoid feedback loops
            const isLoop = (input) => {
                const inUniv = parseInt(input.universe, 10);
                if (input.protocol === 'sacn' && parseInt(updatedConfig.output.sacn.universe, 10) === inUniv) {
                    return true;
                }
                if (input.protocol === 'artnet' &&
                    parseInt(updatedConfig.output.artnet.universe, 10) === inUniv &&
                    parseInt(updatedConfig.output.artnet.subnet, 10) === 0 &&
                    parseInt(updatedConfig.output.artnet.net, 10) === 0) {
                    // Receiver defaults to net 0, subnet 0. So if output matches universe, and net/subnet are 0, it's a loop.
                    return true;
                }
                return false;
            };

            if (isLoop(updatedConfig.inputA)) {
                errorBox.textContent = "Error: Input A creates a feedback loop with Output (same protocol and universe).";
                errorBox.style.display = 'block';
                return;
            }

            if (isLoop(updatedConfig.inputB)) {
                errorBox.textContent = "Error: Input B creates a feedback loop with Output (same protocol and universe).";
                errorBox.style.display = 'block';
                return;
            }

            socket.emit('updateConfig', updatedConfig);
        });

        // Save config to file
        document.getElementById('btnSaveFile').addEventListener('click', () => {
            const config = getConfigFromForm();
            const blob = new Blob([JSON.stringify(config, null, 4)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "dmx-config.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // Load config from file
        const fileInput = document.getElementById('fileLoadConfig');
        document.getElementById('btnLoadFile').addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length === 0) return;
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const loadedConfig = JSON.parse(event.target.result);
                    // Push straight to server, server will echo back and update UI
                    socket.emit('updateConfig', loadedConfig);
                } catch (err) {
                    alert("Error parsing JSON file: " + err.message);
                }
                // Reset input
                fileInput.value = "";
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
